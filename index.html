<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <ul class="human-side">
        <h1 class="your-score">Your Score: </h1>
        <div class="buttons">
            <button>
                <img src="rock.png" class="rock" alt="rock">
            </button>
            <button>
                <img src="paper.png" class="paper" alt="paper">
            </button>
            <button>
                <img src="scissors.png" class="scissors" alt="scissors">
            </button>
        </div>
    </ul>
    <ul class="computer-side">
        <h1 class="computer-score">Computer Score: </h1>
        <div class="buttons">
            <img src="rock.png" class="computer-rock" alt="rock">
            <img src="paper.png" class="computer-paper" alt="paper">
            <img src="scissors.png" class="computer-scissors" alt="scissors">
        </div>
    </ul>


    <script src="javascript.js"></script>
</body>
</html>
